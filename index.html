<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест по административному праву</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1c2233;--mute:#6b7388;--line:#e2e5ee;--brand:#3b5bdb;--brand-ink:#fff;--ok:#1f9d55;--ok-bg:#e4f6ec;--bad:#d64545;--bad-bg:#fdeaea;--warn:#b7791f;--warn-bg:#fff6e0;--shadow:0 1px 2px rgba(20,30,60,.06),0 4px 16px rgba(20,30,60,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#10131c;--card:#181c28;--ink:#e8ebf4;--mute:#97a0b8;--line:#2a3042;--brand:#6c86ff;--brand-ink:#0d1020;--ok:#42c27a;--ok-bg:#12301f;--bad:#ff7070;--bad-bg:#3a1a1a;--warn:#e8b04a;--warn-bg:#33290f;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:22px;margin:8px 0 4px}
h2{font-size:17px;margin:20px 0 8px}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px}
button:hover{border-color:var(--brand)}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.seg button{border:0;background:transparent}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.primary:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:transparent}
.topics label{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.topics label:last-child{border-bottom:0}
.topics .n{margin-left:auto;color:var(--mute);font-size:13px;white-space:nowrap}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand);flex:none;margin-top:2px}
.hint{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:14px;color:var(--mute)}
.top b{color:var(--ink)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--mute)}
.q{font-size:18px;font-weight:600;margin:14px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.multi{font-size:13px;color:var(--brand);margin-bottom:8px;font-weight:600}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;overflow-wrap:anywhere}
.opt:hover{border-color:var(--brand)}
.opt .mk{flex:none;width:22px;height:22px;border:2px solid var(--mute);border-radius:50%;margin-top:1px;display:grid;place-items:center;font-size:13px;line-height:1}
.opt.m .mk{border-radius:6px}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card))}
.opt.sel .mk{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .mk{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .mk{border-color:var(--bad);background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
input.txt{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:12px 0}
.expl{border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--bg);border:1px solid var(--line);font-size:15px;overflow-wrap:anywhere}
.expl.ok{background:var(--ok-bg);border-color:var(--ok)}
.expl.bad{background:var(--bad-bg);border-color:var(--bad)}
.verdict{font-weight:700;margin-bottom:4px}
.warn{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.grid button{width:40px;min-height:40px;padding:0;font-size:14px}
.grid button.done{background:color-mix(in srgb,var(--brand) 18%,var(--card));border-color:var(--brand)}
.grid button.cur{outline:2px solid var(--brand)}
.big{font-size:44px;font-weight:800;line-height:1.1}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.stat{flex:1;min-width:110px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.stat b{display:block;font-size:22px}
.res{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card);overflow:hidden}
.res summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;list-style:none}
.res summary::-webkit-details-marker{display:none}
.res .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;margin-top:1px}
.res.ok .ic{background:var(--ok)}.res.bad .ic{background:var(--bad)}
.res .body{padding:0 14px 14px;font-size:15px}
.res .body p{margin:6px 0;overflow-wrap:anywhere}
.lab{color:var(--mute);font-size:13px}
.hidden{display:none!important}
.hero{padding:18px 4px 6px}
.hero h1{font-size:26px;letter-spacing:-.3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--mute)}
.chip b{color:var(--ink)}
.sec{margin:18px 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.linkbtn{border:0;background:none;color:var(--brand);padding:2px 6px;min-height:0;font-size:13px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin:0 0 6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--warn-bg);color:var(--warn);margin-left:6px;vertical-align:middle;font-weight:600}
.opt .lt{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mute)}
.opt.sel .lt{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opt.ok .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .tx{flex:1;padding-top:2px}
.opt:active{transform:scale(.995)}
.card.fade{animation:fd .2s ease-out}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dock{position:sticky;bottom:0;z-index:5;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:8px}
.dock .row{justify-content:space-between}
.dock .row>button{flex:1;min-width:0}
.dock .row>.primary{flex:2}
.ring{--p:0;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--c,var(--brand)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:4px auto 10px}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:30px;font-weight:800}
.msg{text-align:center;font-size:17px;font-weight:600;margin-bottom:4px}
.kbd{font-size:12px;color:var(--mute);text-align:center;margin-top:10px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:inherit;font-size:11px;background:var(--card)}
.grid button.mark{box-shadow:inset 0 -3px 0 var(--warn)}
.start{position:sticky;bottom:0;background:linear-gradient(to top,var(--card) 75%,transparent);padding:14px 0 4px;margin-top:8px}
.start button{width:100%;min-height:50px;font-size:17px}
@media (max-width:480px){.q{font-size:17px}.hero h1{font-size:23px}.kbd{display:none}}
@media (min-width:900px){.wrap{max-width:820px}}
button,.opt{touch-action:manipulation}
.seg button{min-width:0}
</style>
</head>

a":[1],"e":"Предмет АП — отношения в сфере деятельности публичной администрации и административной юстиции.","f":0,"m":"pdf","s":1},{"id":"P0016","t":"sources","q":"Административно-правовые нормы могут содержаться в (2):","o":["ПП ВС РФ","указах Президента РФ","ФЗ","постановлениях по делам об ап","распоряжениях Правительства РФ"],"a":[1,2],"e":"АП нормы содержатся в указах Президента и ФЗ; нормы также могут быть в актах Правительства.","f":1,"m":"pdf","s":1},{"id":"P0017","t":"procedure","q":"ООО «Альфа» получило через кабинет контрольно-кассовой техники в форме электронного документа постановление о назначении административного штрафа за неприменение контрольно-кассовой техники. Постановление было составлено по результатам проведения автоматизированной информационной системой налоговых органов проверки сообщения физического лица о правонарушении. Протокол об административном правонарушении не составлялся, о рассмотрении дела об ап юр. лицо уведомлено не было. Постановление о назначении наказания вынесено:","o":["правомерно, так как в данном случае дело должно рассматриваться без составления протокола и без вызова лица, в отношении которого ведется производство по делу","неправомерно, так как постановление нужно было направить по почте на бумажном носителе, а не через кабинет контрольно-кассовой техники в форме электронного документа","правомерно, так как в данном случае действует исключение из принципа презумпции невиновности в совершении ап","неправомерно, так как юр. лицу не предоставлена возможность доказать отсутствие правонарушения, при этом лицо не выражало согласия с фактом совершения правонарушения (ч. 5, ст. 28.6 КоАП РФ)"],"a":[3],"e":"Без протокола постановление выносится только при согласии лица с фактом нарушения (ч. 1 и 5 ст. 28.6 КоАП РФ).","f":1,"m":"pdf","s":0},{"id":"P0018","t":"service","q":"Институтом государственной службы, призванным способствовать противодействию коррупции, является институт:","o":["разделения гос. службы на гражданскую, военную и иные виды","распределения гос. служащих по категориям","распределения гос. служащих по группам","разрешения конфликта интересов","возрастных ограничений при поступлении на гос. службу"],"a":[3],"e":"Разрешение конфликта интересов — антикоррупционный институт госслужбы (ФЗ № 273-ФЗ «О противодействии коррупции»).","f":0,"m":"pdf","s":1},{"id":"P0019","t":"sources","q":"Административно-правовая норма, имеющая ретроспективное действие, распространяется на отношения, которые:","o":["возникли после вступления её в силу","возникли до вступления её в силу","возникли до вступления в силу, но продолжающиеся к моменту её вступления"],"a":[1],"e":"Ретроспективное действие — распространение нормы на отношения, возникшие до вступления её в силу.","f":0,"m":"pdf","s":0},{"id":"P0020","t":"procedure","q":"О доставлении делается запись в (2):","o":["протоколе об административном задержании","протоколе о личном досмотре","протоколе об ап"],"a":[0,2],"e":"О доставлении делается запись в протоколе об административном задержании или в протоколе об АП (ч. 2 ст. 27.2 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0021","t":"procedure","q":"Порядок производства по делам об административном правонарушении в судах общей юрисдикции регулируется:","o":["КоАП РФ и законами субъекта РФ об ап","ГПК РФ","КоАП РФ, законами субъекта РФ об ап и КАС РФ","Кодекс административного судопроизводства РФ"],"a":[0],"e":"Порядок производства определяется КоАП РФ и законами субъектов об АП (ст. 1.1 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0022","t":"offense","q":"Для административной и конституционной ответственности характерны следующие общие признаки (более 1 варианта)","o":["ответственность наступает перед государством","субъектами ответственности являются индивиды и коллективные образования","привлечение к ответственности осуществляется в судебном и административном порядке","привлечение к ответственности осуществляется только в судебном порядке","субъектами ответственности являются только физические лица","привлечение к ответственности осуществляется только при установлении вины в совершении противоправного деяния"],"a":[0,1],"e":"Общие признаки: ответственность перед государством; субъекты — индивиды и коллективные образования.","f":0,"m":"pdf","s":0},{"id":"P0023","t":"procedure","q":"Дело об административном правонарушении, по которому было проведено административное расследование, рассматривается по месту:","o":["жительства лица, в отношении которого ведется производство по делу об ап","жительства потерпевшего","нахождения органа, проводившего адм. расследование"],"a":[2],"e":"При проведении административного расследования дело рассматривается по месту нахождения органа, проводившего расследование (ч. 3 ст. 29.5 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0024","t":"procedure","q":"Примером специальной административной жалобы является жалоба гражданина:","o":["на действия сотрудника ГИБДД об ограничении движения трансп. средств","в вышестоящий адм. орган на предписание об устранении нарушений закона, вынесенное по результатам мероприятия гос. контроля","в вышестоящий адм. орган на постановление по делу об ап","водителю автобуса на нарушение пассажиром прав пользования общественным транспортом"],"a":[2],"e":"Специальная жалоба — на постановление по делу об АП (ст. 30.1 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0025","t":"procedure","q":"Инспектором ДПС ГИБДД 02 июля в отношении гражданина вынесено постановление о назначении административного штрафа за нарушение правил дорожного движения. Копия постановления вручена гражданину в день его вынесения. Последним днем срока подачи жалобы на постановление по делу об ап является:","o":["02 августа","17 июля","11 июля","12 октября","12 июля"],"a":[4],"e":"Жалоба подаётся в течение 10 суток со дня вручения копии постановления (ст. 30.3 КоАП РФ): 02.07 + 10 суток = 12.07.","f":0,"m":"pdf","s":0},{"id":"P0026","t":"penalty","q":"Принудительное исполнение постановления о назначении административного наказания в виде административного ареста осуществляет:","o":["прокурор","судебный пристав-исполнитель","мировой судья","ОВД","районный суд"],"a":[3],"e":"Постановление об административном аресте исполняется органами внутренних дел (ст. 32.8 КоАП РФ).","f":0,"m":"pdf","s":1},{"id":"P0027","t":"bodies","q":"Государственным органом исполнительной власти специальной компетенции является:","o":["Федеральная налоговая служба РФ","высший орган исполнительной власти РФ","Президент РФ","высшее д. лицо субъекта РФ","Правительство РФ"],"a":[0],"e":"ФНС — федеральная служба, орган специальной компетенции.","f":0,"m":"pdf","s":1},{"id":"P0028","t":"bodies","q":"Органом, функционирующим исключительно на коллегиальной основе, является:","o":["федеральное агентство","федеральная служба","федеральный комитет","федеральное министерство","Правительство РФ"],"a":[4],"e":"Правительство РФ действует только на коллегиальной основе (ФКЗ «О Правительстве РФ»).","f":0,"m":"pdf","s":0},{"id":"P0029","t":"bodies","q":"Членами Правительства РФ являются (2):","o":["руководители федеральных агентств, руководство деятельностью которых осуществляет Президент РФ","руководители федеральных служб, руководство деятельностью которых осуществляет Президент РФ","заместители Председателя Правительства РФ","Президент РФ","руководители фед. служб, руководство деятельностью которых осуществляет Правительство РФ","федеральные министры"],"a":[2,5],"e":"Члены Правительства: Председатель, его заместители, федеральные министры (ФКЗ «О Правительстве РФ»).","f":0,"m":"pdf","s":1},{"id":"P0030","t":"offense","q":"Общественные объединения могут создаваться в одной из следующих организационно-правовых форм:","o":["орган общественного самоуправления","открытое акционерное общество","закрытое акционерное общество","общество с дополнительной ответственностью","общественное движение"],"a":[4],"e":"Форма общественного объединения — общественное движение (ст. 7 ФЗ «Об общественных объединениях»).","f":0,"m":"pdf","s":0},{"id":"P0032","t":"procedure","q":"Постановлением должностного лица гражданину А. было назначено административное наказание в виде штрафа. А. обжаловал данное постановление в судебном порядке. Суд установил нарушение срока составления протокола об административном правонарушении на 10 дней. Факт совершения правонарушения А. признавал. Суду следует:","o":["вынести решение об изменении постановления","отменить постановление, возбудить дело об административном правонарушении в отношении должностного лица, вынесшего постановление","отменить постановление должностного лица и прекратить производство по делу","отменить постановление должностного лица, вернуть дело в орган, должностному лицу, правомочным рассмотреть дело для выяснения причин пропуска срока составления протокола","оставить постановление без изменения, а жалобу без удовлетворения (абз. 3 п. 4 ППВС РФ от 24.03.2005 №5)"],"a":[4],"e":"Нарушение срока составления протокола не является существенным недостатком (п. 4 Постановления Пленума ВС РФ № 5 от 24.03.2005).","f":0,"m":"pdf","s":0},{"id":"P0034","t":"coercion","q":"Административно-восстановительной мерой является:","o":["принудительное медицинское освидетельствование","снос самовольной постройки","принудительное уничтожение заразных животных","временный запрет деятельности организации","дисквалификация"],"a":[1],"e":"Снос самовольной постройки — восстановительная мера.","f":0,"m":"pdf","s":1},{"id":"P0035","t":"bodies","q":"В ведении Министерства финансов РФ находится:","o":["Федеральная служба страхового надзора","Федеральная налоговая служба"],"a":[1],"e":"ФНС находится в ведении Минфина России (Федеральная служба страхового надзора упразднена).","f":0,"m":"pdf","s":0},{"id":"P0037","t":"bodies","q":"Государственным органом исполнительной власти общей компетенции является:","o":["Правительство Российской Федерации","Федеральная служба безопасности России","Управление делами Президента Российской Федерации","Министерство обороны Российской Федерации","Совет безопасности Российской Фед нии, совершенном юридическим лицом или лицом осуществляющим предпринимательскую деятельность без образования юридического лица, в связи с осуществлением предпринимательской (?или?) иной экономической деятельности, обжалуется:","o":["в гарнизонный суд","в районный суд","мировому судье","в третейский суд","в арбитражный суд"],"a":[4],"e":"Постановление по делу о предпринимательской деятельности обжалуется в арбитражный суд (ч. 3 ст. 30.1 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0043","t":"penalty","q":"Исполнение постановления о дисквалификации производится путем:","o":["изъятия служебного удостоверения у дисквалифицированного лица","помещения дисквалифицированного лица под домашний арест","приостановления действия договора (контракта) с дисквалифицированным лицом","прекращения договора (контракта) с дисквалифицированным лицом","изъятия трудовой книжки дисквалифицированного лица и внесения в нее соответствующей записи"],"a":[3],"e":"Дисквалификация исполняется прекращением контракта с лицом (ст. 32.11 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0044","t":"procedure","q":"По результатам рассмотрения дела об административном правонарушении может быть:","o":["вынесено решение","вынесено определение","издан приказ","вынесено постановление","составлен акт"],"a":[1,3],"e":"По результатам рассмотрения выносится постановление или определение (ст. 29.9 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0045","t":"penalty","q":"На рассмотрение руководителю административного органа поступили материалы двух дел о совершении ООО «Омега» административных правонарушений. Правонарушения совершены в форме идеальной совокупности. Санкция за одно правонарушение предусматривает наложение предупреждения или административного штрафа в размере от 10 000 до 20 000 рублей. Санкция за второе правонарушение предусматривает наложение административного штрафа в размере от 30 000 до 60 000 рублей. ООО «Омега» подлежит привлечению к административной ответственности с назначением:","o":["предупреждения и административного штрафа в размере от 30 000 до 60 000 рублей","одного административного штрафа в размере от 40 000 до 80 000 рублей","одного административного штрафа в размере 80 000 рублей","одного административного штрафа в размере от 30 000 до 60 000 рублей (ч. 2 ст. 4.4 КоАП РФ)","двух административных штрафов в пределах каждой из санкций"],"a":[3],"e":"При идеальной совокупности назначается наказание по санкции более строгой (ч. 2 ст. 4.4 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0049","t":"coercion","q":"По времени осуществления различается контроль:","o":["сплошной и выборочный","предварительный, текущий и последующий","фактический и документарный","постоянный и временный","постоянный, временный и чрезвычайный"],"a":[1],"e":"По времени контроль: предварительный, текущий, последующий.","f":0,"m":"pdf","s":0},{"id":"P0050","t":"procedure","q":"Свидетелем по делу об административном правонарушении может быть:","o":["любое лицо, независимо от возраста","только лицо, достигшее возраста 7 лет","только совершеннолетнее лицо","только лицо, достигшее возраста 14 лет","только лицо, достигшее возраста 16 лет"],"a":[0],"e":"Свидетелем может быть любое лицо, которому известны обстоятельства дела (ст. 25.6 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0051","t":"offense","q":"Действия лица в состоянии крайней необходимости является обстоятельством:","o":["отягчающим административную ответственность","свидетельствующим о малозначительности административного правонарушения","смягчающим административную ответственность","исключающим производство по делу об административном правонарушении"],"a":[3],"e":"Крайняя необходимость — обстоятельство, исключающее административную ответственность (ст. 2.7 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0052","t":"sources","q":"Под нормативным правовым актом понимается акт органа государственной власти, органа местного самоуправления или должностного лица устанавливающий (пометить 2)","o":["ответственность конкретного лица","правовые нормы, рассчитанные на неоднократное применение","правила поведения, рассчитанные на однократное применение","решение по конкретному делу","права и обязанности конкретных лиц","правила поведения, обязательные для неопределенного круга лиц"],"a":[1,5],"e":"НПА содержит правила поведения, обязательные для неопределённого круга лиц и рассчитанные на неоднократное применение.","f":0,"m":"pdf","s":0},{"id":"P0053","t":"offense","q":"Для административной и уголовной ответственности характерны следующие общие признаки (пометить 2):","o":["регулирование осуществляется только федеральным законодательством","применяется в целях предупреждения совершения новых противоправных деяний","субъектами являются только физические лица","наступает только при установлении вины","наступает перед государством","применяется только в судебном порядке"],"a":[1,4],"e":"Общее: ответственность перед государством, цель — предупреждение новых нарушений.","f":0,"m":"pdf","s":1},{"id":"P0054","t":"sources","q":"Решение по общей административной жалобе:","o":["может быть обжаловано только в суд","является окончательным и обжалованию не подлежит","может быть обжаловано только в Правительство РФ","может быть обжаловано только в вышестоящий орган или высшему должностному лицу","может быть обжаловано или в вышестоящий орган (высшему должностному лицу) или в суд"],"a":[4],"e":"Решение по жалобе можно обжаловать в вышестоящий орган или в суд (ст. 40 КАС РФ; ФЗ № 59-ФЗ).","f":0,"m":"pdf","s":0},{"id":"P0055","t":"bodies","q":"К правовым формам деятельности публичной администрации относятся (пометить 2)","o":["принятие индивидуальных актов","разработка прогнозов и планов","кадровое обеспечение","делопроизводство","статистический учет","принятие нормативных актов"],"a":[0,5],"e":"Правовые формы: принятие нормативных и индивидуальных актов.","f":0,"m":"pdf","s":1},{"id":"P0056","t":"bodies","q":"Текущий контроль вышестоящего органа исполнительной сласти за деятельностью нижестоящего органа исполнительной власти относится:","o":["к контрольно-надзорным отношениям","к административно-управленческим отношениям","к административно-юстиционным отношениям","к административно-процедурным"],"a":[1],"e":"Текущий контроль вышестоящего над нижестоящим — административно-управленческие отношения. Требует сверки.","f":1,"m":"pdf","s":1},{"id":"P0058","t":"sources","q":"Диспозитивный метод в административно-правовом регулировании:","o":["используется, но в меньшей степени, чем императивный","преобладает","не используется","используется наравне с императивным методом"],"a":[0],"e":"Диспозитивный метод используется в меньшей степени, чем императивный.","f":0,"m":"pdf","s":1},{"id":"P0059","t":"procedure","q":"Признаком специальной административной жалобы является","o":["возможность подачи как индивидуально, так и коллективно","возможность подачи в защиту как своих прав и интересов, так и в защиту прав и интересов других лиц","наличие процедурных особенностей в производстве по конкретным видам жалоб","отсутствие ограничения срока подачи жалобы","возможность подачи как в устной, так и в письменной форме","отсутствие ограничения сроков подачи жалобы"],"a":[2],"e":"Признак специальной жалобы — процедурные особенности. Требует сверки.","f":1,"m":"pdf","s":0},{"id":"P0060","t":"procedure","q":"К обстоятельствам, исключающим производство по делу об административном правонарушении относится (пометить 2):","o":["совершение административного правонарушения шестнадцатилетним","совершение административного правонарушения в состоянии наркотического опьянения","отсутствие события административного правонарушения","совершение административного правонарушения военнослужащим","совершение административного правонарушения в состоянии токсического опьянения","отмена закона, установившего адм. ответственность"],"a":[2,5],"e":"Исключают производство: отсутствие события, отмена закона (ст. 24.5 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0061","t":"subjects","q":"Ежегодные квоты на выдачу приглашений на въезд иностранным гражда тивное правонарушение, причиненного ущерба лицо, рассматривающее дело об административном правонарушении","o":["вправе учесть данное обстоятельство в качестве смягчающего административную ответственность","не вправе учесть данное обстоятельство в качестве смягчающего административную ответственность","вправе учесть данное обстоятельство в качестве смягчающего административную ответственность, только если на это указано в статье КоАП РФ, устанавливающей ответственность за совершение данного правонарушения","обязано учесть данное обстоятельство в качестве смягчающего административную ответственность"],"a":[3],"e":"Добровольное возмещение вреда — обязательно смягчающее (ч. 1 ст. 4.2 КоАП РФ).","f":0,"m":"pdf","s":1},{"id":"P0401","t":"procedure","q":"Видами производств по делу об административном правонарушении являются","o":["обычное и упрощенное (усеченное) производства","обычное и ускоренное производства","обычное, упрощенное (усеченное) и усложненное производства","обычное, упрощенное (усеченное), усложненное и ускоренное производства"],"a":[3],"e":"Виды производства: обычное, упрощённое, усложнённое, ускоренное.","f":0,"m":"pdf","s":0},{"id":"P0403","t":"procedure","q":"Участником производства по делу об административном правонарушении, содействующим осуществлению производства, является","o":["прокурор","представитель","переводчик","потерпевший"],"a":[2],"e":"Переводчик содействует осуществлению производства (ст. 25.10 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0404","t":"procedure","q":"К обстоятельствам, исключающим производство по делу об административном правонарушении, относятся (более 1 варианта)","o":["отсутствие события административного правонарушения","совершение административного правонарушения 16-летним","совершение административного правонарушения в состоянии токсического опьянения","совершение административного правонарушения в состоянии наркотического опьянения","отмена закона, установившего административную ответственность"],"a":[0,4],"e":"Исключают производство отсутствие события и отмена закона (ст. 24.5 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0405","t":"procedure","q":"Для оказания юридической помощи потерпевшему в производстве по делу об административном правонарушении может участвовать","o":["представитель","эксперт по юридическим вопросам","консультант","юрист"],"a":[0],"e":"Потерпевшему помогает представитель (ст. 25.5 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0406","t":"procedure","q":"Совершеннолетнее лицо, владеющее языками или навыками сурдоперевода (осуществляющее сурдоперевод или тифлосурдоперевод), необходимыми для перевода или сурдоперевода при производстве по делу об административном правонарушении, называется","o":["законный представитель","переводчик","сурдопереводчик","защитник"],"a":[1],"e":"Переводчик (ст. 25.10 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0407","t":"procedure","q":"ООО «Управляющая компания» выдало Иванову И.И. доверенность на ведение от его имени дела об административном правонарушении, возбужденного в отношении ООО «Управляющая компания» по ст. 6.4 КоАП РФ. Иванов И.И. имеет по делу об административном правонарушении процессуальный статус","o":["защитник","законный представитель юридического лица","представитель","поверенный","понятой"],"a":[0],"e":"Лицо, нанятое привлекаемым юрлицом для защиты, — защитник (ст. 25.5 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0408","t":"procedure","q":"Д., обладающий специальными познаниями, был привлечен к участию в деле об административном правонарушении для проведения исследования с целью определения качества стеклоомывающей жидкости и дачи заключения по этому вопросу. Д. имеет по делу об административном правонарушении процессуальный статус","o":["специалист","свидетель","эксперт","инспектор"],"a":[2],"e":"Эксперт проводит исследование и даёт заключение (ст. 25.9 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0409","t":"procedure","q":"В отношении гражданина А. за нарушение правил дорожного движения составлен протокол об административном правонарушении. Через несколько дней после этого вынесено постановление о назначении административного штрафа. В данном случае имело место","o":["усеченное производство","обычное производство","ускоренное производство","усложнённое производство"],"a":[1],"e":"Обычное производство — протокол, затем постановление.","f":0,"m":"pdf","s":0},{"id":"P0410","t":"procedure","q":"Инспектором ДПС ГИБДД 13 марта в отношении гражданина вынесено постановление о назначении административного штрафа за нарушение правил дорожного движения. Копия постановления вручена гражданину в день его вынесения. Назовите последний день срока подачи жалобы на постановление по делу об административном правонарушении.","o":["23 марта","13 апреля","13 июня","22 марта","23 апреля"],"a":[0],"e":"10 суток со дня вручения: 13 марта + 10 суток = 23 марта (ст. 30.3 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0411","t":"procedure","q":"В отсутствии потерпевшего дело может быть рассмотрено, если:","o":["имеются данные о надлежащем извещении потерпевшего о месте и времени рассмотрения дела и если от потерпевшего не поступило ходатайство об отложении рассмотрения дела","если ходатайство об отложении дела оставлено без удовлетворения"],"a":[0,1],"e":"Дело рассматривается без потерпевшего при надлежащем извещении (ч. 3 ст. 25.2 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0417","t":"procedure","q":"Во всех случаях изъятия вещей и документов при производстве по делу об административном правонарушении:","o":["должны присутствовать два понятых","должны быть применены фото- и киносъемка, видеозапись и иные установленные способы фиксации вещественных доказательств","составляется протокол или делается соответствующая запись в протоколе о доставлении или - в протоколе об административном задержании","изъятое должно быть упаковано и опечатано на месте изъятия","изъятое хранится в местах, определенных должностным лицом, осуществившим изъятие"],"a":[2],"e":"При изъятии вещей и документов составляется протокол либо делается запис ,1,3,4,5,7],"e":"Виды наказаний — ст. 3.2 КоАП РФ.","f":0,"m":"pdf","s":0},{"id":"P0445","t":"sources","q":"Законодательство об административных правонарушениях включает:","o":["общепризнанные принципы и нормы международного права","Конституция РФ","КоАП РФ и принятые в соответствии с ним законы субъектов об административных правонарушениях","нормативные правовые акты федеральных органов"],"a":[2],"e":"Законодательство об АП состоит из КоАП РФ и законов субъектов (ст. 1.1 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0451","t":"coercion","q":"Проникновение сотрудника полиции в жилые помещения помимо воли проживающих в них граждан допускается для (пометить 2):","o":["проверки соблюдения правил пожарной безопасности","пресечения преступления","установления обстоятельств дела об административном правонарушении","проверки соблюдения иностранными гражданами и лицами без гражданства правил миграционного учета","установление обстоятельств несчастного случая","проверки регистрации граждан по месту жительства"],"a":[1,4],"e":"Проникновение в жилище — ст. 15 ФЗ «О полиции».","f":0,"m":"pdf","s":1},{"id":"P0452","t":"sources","q":"Предписание как способ административно-правового регулирования в большей степени проявляется в административно-правовом отношении, именуемом:","o":["процессуальным; вертикальным","вертикальным","горизонтальным","материальным"],"a":[1],"e":"Предписание проявляется в вертикальных отношениях.","f":0,"m":"pdf","s":1},{"id":"P0453","t":"procedure","q":"Принцип законности в производстве по делу об административном правонарушении предусматривает, что","o":["лицо подлежит административной ответственности только за те административные правонарушения, в отношении которых установлена его вина","обязательно выяснение всех обстоятельств, имеющих значение для правильного рассмотрения дела об административном правонарушении","лицо, привлекаемое к административной ответственности, не может быть подвергнуто административному наказанию и мерам обеспечения производства по делу об административном правонарушении иначе как на основаниях и в порядке, установленных законом","лица, осуществляющие производство, обязаны при выяснении обстоятельств дела избегать обвинительного уклона, быть беспристрастными"],"a":[2],"e":"Принцип законности — ст. 1.6 КоАП РФ.","f":0,"m":"pdf","s":0},{"id":"P0455","t":"procedure","q":"Постановление по делу об административном правонарушении, вынесенное коллегиальным органом в отношении физического лица, обжалуется:","o":["мировому судье","в районный суд","в административную комиссию","в арбитражный суд","в Правительство субъекта РФ"],"a":[1],"e":"Постановление коллегиального органа обжалуется в районный суд (ст. 30.1 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0456","t":"offense","q":"В случае совершения административного правонарушения беременной женщиной лицо, рассматривающее дело об административном правонарушении:","o":["обязано учесть данное обстоятельство в качестве смягчающего административную ответственность","вправе учесть данное обстоятельство в качестве смягчающего административную ответственность","вправе учесть данное обстоятельство в качестве смягчающего административную ответственность, только если на это указано в статье КоАП РФ, устанавливающей ответственность за совершение данного правонарушения","не вправе учесть данное обстоятельство в качестве смягчающего административную ответственность"],"a":[0],"e":"Беременность — обязательно учитываемое смягчающее обстоятельство (ст. 4.2 КоАП РФ).","f":0,"m":"pdf","s":1},{"id":"P0457","t":"sources","q":"«Полицейское право» - это:","o":["институт административного права, система норм, регулирующих деятельность органов полиции","название современной науки административного права в некоторых зарубежных странах","этап в развитии административного права, наука, изучающая общественные отношения в сфере государственного управления","неправовой термин, обозначающий произвол правоохранительных органов"],"a":[2],"e":"По ключу источника (историческое понятие «полицейское право»). Сверить с учебником.","f":1,"m":"pdf","s":0},{"id":"P0458","t":"bodies","q":"К полномочиям высшего должностного лица субъекта РФ относится:","o":["утверждение программ социально-экономического развития субъекта РФ","формирование высшего исполнительного органа государственной власти субъекта РФ","установление системы исполнительных органов государственной власти субъекта РФ","формирование органов исполнительной власти субъекта РФ специальной компетенции"],"a":[1],"e":"Высшее должностное лицо субъекта формирует высший исполнительный орган (ФЗ № 414-ФЗ).","f":0,"m":"pdf","s":0},{"id":"P0459","t":"sources","q":"Активная позиция суда в собирании доказательств по делу, возникающему из административных правоотношений, означает, что суд может истребовать доказательства:","o":["по своей инициативе у третьих лиц","по ходатайству гражданина-заявителя у третьих лиц (по фотке этот вариант неверный)","по ходатайству гражданина-заявителя у административного органа","по ходатайству административного органа у третьих лиц","по своей инициативе у гражданина-заявителя"],"a":[0],"e":"Суд вправе истребовать доказательства по своей инициативе (ст. 63 КАС РФ).","f":0,"m":"pdf","s":0},{"id":"P0461","t":"sources","q":"Административно-правовая норма, имеющая перспективное действие, распространяется на отношения, которые:","o":["возникли после вступления ее в силу","возникли до вступления ее в силу – с момента вступления ее в силу","возникли до вступления ее в силу – с момента их возникновения","прекратились до начала действия административно-правовой нормы"],"a":[0],"e":"Перспективное действие — на отношения, возникшие после вступления нормы в силу.","f":0,"m":"pdf","s":1},{"id":"P0462","t":"bodies","q":"Система и структура федеральных органов исполнительной власти устанавливается:","o":["федеральным законом","федеральным конституционным законом","постановлением Правительства РФ","указом Президента РФ","Конституцией РФ"],"a":[3],"e":"Систему и структуру ФОИВ устанавливает указ Президента РФ (ст. 112 Конституции РФ).","f":0,"m":"pdf","s":0},{"id":"P0463","t":"subjects","q":"Инспектор ДПС остановил гражданина Н., управляющего транспортным средством с соблюдением правил дорожного движения, для проверки документов. После проверки документов водителю было разрешено продолжить движение. Гражданин Н. Решил обжаловать в суд действия инспектора в связи с отсутствием законных оснований для остановки. Порядок подачи жалобы регулируется:","o":["КоАП РФ","КАС РФ","ФЗ от 2.05.2006 №59 «О порядке рассмотрения обращений граждан РФ»","АПК РФ","ГПК РФ","Указом Президиума Верховного Совета СССР от 12.04.1968 №2534-VII «О порядке рассмотрения предложений, заявлений и жалоб граждан»"],"a":[1],"e":"Действия должностного лица оспариваются по КАС РФ (гл. 22).","f":0,"m":"pdf","s":0},{"id":"P0465","t":"sources","q":"Административно-правовой метод регулирования характеризуется (пометить 2):","o":["децентрализованным регулированием","юридическим неравенством сторон","юридическим равенством сторон","решением споров исключительно в судебном порядке","наличием властных предписаний"],"a":[1,4],"e":"Метод АП — неравенство сторон и властные предписания.","f":0,"m":"pdf","s":1},{"id":"P0466","t":"sources","q":"По способу осуществления различается контроль:","o":["предварительный, текущий и последующий","фактический и документальный","сплошной и выборочный","судебный и административный","внутренний (внутриведомственный) и внешний (вневедомственный)"],"a":[1],"e":"По классификации контроля «по способу» — фактический и документальный. Ключ источника отличался, сверить.","f":1,"m":"pdf","s":0},{"id":"P0467","t":"procedure","q":"Примером общей административной жалобы является жалоба:","o":["на определение об отказе в возбуждении дела об административном правонарушении","на постановление о прекращении производства по делу об административном правонарушении","на решение налогового органа о наложении штрафа за несвоевременную уплату налога","на решение по жалобе на постановление по делу об административном правонарушении","на отказ в выдаче разрешения на охоту","на отказ в выдаче разрешения на строительство"],"a":[4,5],"e":"Общая жалоба — на отказ в выдаче разрешений (не регулируется специальным порядком).","f":0,"m":"pdf","s":0},{"id":"P0468","t":"sources","q":"В случае раскаяния лица, совершившего административное правонарушение, в содеянном, лицо, рассматривающее дело об административном правонарушении:","o":["вправе учесть данное обстоятельство в качестве смягчающего административную ответственность","вправе учесть данное обстоятельство в качестве смягчающего административную ответственность, только если на это указано в статье КоАП РФ, устанавливающей ответственность за совершение данного преступления","обязано учесть данное обстоятельство в качестве смягчающего административную ответственность","не вправе учесть данное обстоятельство в качестве смягчающего административную ответственность"],"a":[2],"e":"Раскаяние — смягчающее обстоятельство (ст. 4.2 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0469","t":"sources","q":"Правительство Российской Федерации принимает нормативно-правовые акты в форме:","o":["постановлений","распоряжений","приказов","указов","писем"],"a":[0],"e":"Правительство издаёт нормативные акты в форме постановлений (ст. 115 Конституции РФ).","f":0,"m":"pdf","s":1},{"id":"P0470","t":"bodies","q":"Дела об административных правонарушениях, предусмотренных законами субъектов Российской Федерации, рассматриваются (пометить 2):","o":["районными судами","административными комиссиями","судьями уставных судов субъектов РФ","судьями арбитражных судов","третейскими судами","мировыми судьями + уполномоченными органами и учреждениями органов исполнительной власти субъектов Российской Федерации и комиссиями по делам несовершеннолетних"],"a":[1,5],"e":"Дела по законам субъектов рассматривают административные комиссии, мировые судьи и иные органы (ст. 22.1 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0472","t":"bodies","q":"Главной задаче ий (ст. 28.7 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0508","t":"bodies","q":"В систему федеральных органов исполнительной власти входят:","o":["федеральные службы","федеральные надзоры","федеральные ведомства","федеральные комиссии","государственные комитеты"],"a":[0],"e":"В систему ФОИВ входят министерства, службы, агентства.","f":0,"m":"pdf","s":0},{"id":"P0511","t":"procedure","q":"Постановлением должностного лица гражданину Грибову было назначено административное наказание в виде штрафа. Грибов обжаловал данное постановление в судебном порядке. Суд установил, что для составления протокола об административном правонарушении Грибов вызван не был, дело об административном правонарушении составлено в отсутствии Грибова, без его извещения. Суду следует:","o":["отменить постановление должностного лица, прекратить производство по делу","вынести решение об изменении постановления","отменить постановление и возбудить дело об административном правонарушении в отношении должностного лица, вынесшего постановление","отменить постановление должностного лица, вернуть его в орган, должностному лицу, правомочным рассмотреть дело","оставить постановление без изменения, а жалобу без удовлетворения"],"a":[3],"e":"Существенное нарушение — отмена постановления и возврат дела (п. 4 ч. 1 ст. 30.7 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0512","t":"bodies","q":"Административно-правовое отношение возникает при заключении:","o":["соглашения между министерством РФ и министерством субъекта РФ о делегировании отдельных государственных полномочий","договора между федеральным министерством и открытым акционерным обществом на поставку компьютерной техники","трудового договора между федеральным министерством и гражданином","договора между РФ и субъектом РФ о разграничении предметов ведения"],"a":[0],"e":"Соглашение о делегировании полномочий — административно-правовое отношение.","f":0,"m":"pdf","s":1},{"id":"P0514","t":"bodies","q":"Федеральное министерство осуществляет функции по (пометить ному лицу, вынесшему постановление, для выяснения причин пропуска срока давности","отменить постановление, возбудить производство по делу об административном правонарушении в отношении должностного лица, вынесшего постановление","отменить постановление должностного лица, прекратить производство по делу","вынести решение об изменении постановления","оставить постановление без изменения, поскольку факт совершения правонарушения не оспаривался"],"a":[2],"e":"При истечении срока давности производство прекращается (п. 6 ч. 1 ст. 24.5 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0519","t":"bodies","q":"Правовые формы деятельности публичной администрации по целям управляющего воздействия подразделяются на:","o":["правотворческие и правоприменительные","процессуальные и не процессуальные","материальные и процессуальные","словесные и конклюдентные","внутренние и внешние"],"a":[4],"e":"По целям управляющего воздействия формы делятся на внутренние и внешние.","f":0,"m":"pdf","s":0},{"id":"P0520","t":"procedure","q":"О возбуждении дела об административном правонарушении прокурором выносится:","o":["определение","протокол","решение","постановление","приказ"],"a":[3],"e":"Прокурор выносит постановление (ст. 28.4 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0521","t":"sources","q":"Порядок рассмотрения арбитражными судами дел об административных правонарушениях, совершенных юридическими лицами и индивидуальными предпринимателями в связи с осуществлением предпринимательской или иной экономической деятельности, регулируется:","o":["КоАП, АПК и КАС","только КоАП","только АПК","КоАП и КАС","КоАП и АПК"],"a":[4],"e":"Порядок регулируется КоАП РФ и АПК РФ.","f":0,"m":"pdf","s":0},{"id":"P0522","t":"procedure","q":"Нормативный срок проведения административного расследования составляет:","o":["один месяц с момента выявления административного правонарушения","десять суток с момента возбуждения дела об административном правонарушении","один месяц с момента возбуждения дела об административном пра тративных судов.","f":0,"m":"pdf","s":0},{"id":"P0552","t":"sources","q":"Если административное правонарушение совершено в состоянии опьянения, лицо, рассматривающее дело об административном правонарушении:","o":["обязано учесть данное обстоятельство в качестве отягчающего административную ответственность","может учесть данное обстоятельство в качестве отягчающего","вправе учесть данное обстоятельство в качестве смягчающего административную ответственность","обязано учесть данное обстоятельство в качестве смягчающего административную ответственность"],"a":[1],"e":"Опьянение учитывается как отягчающее по усмотрению судьи (п. 6 ч. 1 ст. 4.3 КоАП РФ).","f":0,"m":"pdf","s":1},{"id":"P0553","t":"procedure","q":"Обязанность доказывания законности оспариваемых решений и действий (бездействия) государственных органов, в рамках административного судопроизводства возлагается на:","o":["прокурора","заявителя, обратившегося в суд с требованием об оспаривании решений и действий (бездействия) гос. органов","представителя заявителя …","суд, рассматривающий дело","органы и лиц, которые приняли оспариваемый акт, решение…"],"a":[4],"e":"Обязанность доказывать законность акта возлагается на орган (ч. 11 ст. 226 КАС РФ).","f":0,"m":"pdf","s":0},{"id":"P0554","t":"procedure","q":"Дело об административном правонарушении может быть возбуждено:","o":["актом о результатах проверки, составленным пожарным инспектором","решением мирового судьи","приказом начальника таможни","определением суда","постановлением прокурора"],"a":[4],"e":"Дело возбуждается постановлением прокурора (ст. 28.1 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0555","t":"procedure","q":"Постановление о возбуждении административного правонарушения отличается от протокола об административном правонарушении тем, что постановление о возбуждении административного правонарушения составляется:","o":["в случае проведения по делу административного расследования","по особо сложным делам","в случае автоматической фиксации правонарушения в автоматическом режиме специальными техническими средствами","по делам, влекущим возможность назначения административного ареста","при возбуждении дела прокурором"],"a":[4],"e":"Прокурор возбуждает дело постановлением (ст. 28.4 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0556","t":"procedure","q":"Жалоба на постановление по делу об административном правонарушении подается (ст. 30.2 КоАП):","o":["судье, в орган, ДЛ, которым вынесено оспариваемое постановление (и только они направляют его в вышестоящий)","непосредственно в суд, вышестоящий орган, вышестоящему ДЛ, уполномоченным ее рассматривать","судье, в орган, ДЛ, которым вынесено постановление, либо непосредственно в суд, вышестоящий орган, вышестоящему ДЛ, уполномоченным ее рассматривать","в суд, вышестоящий орган, вышестоящему ДЛ, уполномоченным ее рассматривать через ДЛ, составившее протокол об административном правонарушении"],"a":[2],"e":"Жалоба подаётся судье, органу, должностному лицу или непосредственно в суд (ст. 30.2 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0557","t":"penalty","q":"А. повторно допустил выезд в нарушение Правил дорожного движения на полосу, предназначенную для встречного движения, что влечет лишение права управления транспортными средствами на срок один год, а в случае фиксации административного правонарушения работающими в автоматическом режиме специальными техническими средствами, имеющими функции фото- и киносъемки, видеозаписи, или средствами фото- и киносъемки, видеозаписи – наложение административного штрафа в размере пяти тысяч рублей. Инспектор ДПС ГИБДД зафиксировал данное правонарушение с помощью видеокамеры, составил протокол об административном правонарушении с участием А. и направил дело на рассмотрение в суд для назначения лишения права управления транспортным средством. Водитель считает действия инспектора незаконными и полагает, что в связи с фиксацией нарушения на камеру инспектор должен был сам назначить административный штраф в размере 5 000 рублей. Инспектор действовал:","o":["неправомерно, так как совершение правонарушения зафиксировано с помощью технического средства, имеющего функцию видеозаписи, инспектор должен был сам рассмотреть дело","правомерно, так как техническое средство, которым зафиксировано совершение правонарушения, не работало в автоматическом режиме","неправомерно, так как в связи с фиксацией совершения правонарушения специальным техническим средством инспектор должен был сам рассмотреть дело и назначить административный штраф в размере 5 000 рублей","неправомерно, так как в связи с фиксацией совершения правонарушения специальным техническим средством должен был сам рассмотреть дело и назначить административный штраф в размере половины от предусмотренного санкцией соответствующей статьи"],"a":[1],"e":"Не автоматическая фиксация — протокол и рассмотрение судом.","f":0,"m":"pdf","s":0},{"id":"P0558","t":"procedure","q":"Факультативной стадией производства по делу об административном правонарушении является:","o":["вынесение решения по делу об административном правонарушении","исполнение постановления по делу об административном правонарушении","административное расследование","возбуждение дела об административном правонарушении","пересмотр постановление (решения) по делу об административном правонарушении"],"a":[4],"e":"Пересмотр — факультативная стадия.","f":0,"m":"pdf","s":0},{"id":"P0559","t":"procedure","q":"Минимальное число понятых в производстве по делу об административном правонарушении:","o":["2 (двух)","3","1","5","4"],"a":[0],"e":"Понятых — не менее двух (ст. 25.7 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0560","t":"procedure","q":"Усеченное производство отличается от обычного:","o":["отсутствием протокола об административном правонарушении","отсутствием административного расследования","отсутствием стадии пересмотра постановления об административном правонарушении","сокращенными сроками рассмотрения дела","сокращенными сроками обжалования постановления по делу об административном правонарушении"],"a":[0],"e":"Усечённое производство — без протокола.","f":0,"m":"pdf","s":0},{"id":"P0561","t":"procedure","q":"Законным представителем юридического лица является:","o":["член совета директоров","лицо, действующее на основании ордера","лицо, действующее на основании доверенности","его руководитель (ч. 2 ст. 25.4 КоАП)","его учредитель"],"a":[3],"e":"Законный представитель юрлица — его руководитель (ч. 2 ст. 25.4 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0562","t":"penalty","q":"Административными наказаниями, которые могут устанавливаться законами субъектов РФ об административных правонарушениях, являются:","o":["административный штраф и административный арест","предупреждение и административное выдворение за пределы РФ","предупреждение, административный штраф и административное выдворение за пределы РФ","предупреждение и административный штраф (ч. 3 ст. 3.2 КоАП)","административный штраф и лишение специального права, предоставленного физическому лицу","предупреждение, административный штраф и административный запрет на посещение мест проведения официальных спортивных соревнований в дни их проведения"],"a":[3],"e":"Законами субъектов устанавливаются предупреждение и штраф (ч. 2 ст. 3.2 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0563","t":"penalty","q":"В. проехал перекресток на запрещающий сигнал светофора. Данное нарушение влечет наложение административного штрафа в размере одной тысячи рублей. Инспектор ДПС ГИБДД зафиксировал нарушение с помощью видеокамеры, не остановив водителя транспортного средства. В тот же день инспектор вынес постановление о назначении административного штрафа в размере одной тысячи рублей и направил его по почте в адрес В. Инспектор действовал:","o":["неправомерно, так как в случае рассмотрение дела о вынесении постановления о назначении административного наказания без вызова лица, в отношении которого ведется производство по делу, назначается административный штраф в размере половины от предусмотренного санкцией соответствующей статьи","неправомерно, так как техническое средство, которым зафиксировано совершение правонарушения, не работало в автоматическом режиме","неправомерно, так как действующим законодательством не предусмотрено рассмотрение дела и вынесение постановления о назначении административного наказания без вызова лица, в отношении которого ведется производство по делу","правомерно, так как совершение правонарушения зафиксировано с помощью технического средства, имеющего функцию видеозаписи"],"a":[1],"e":"Постановление без протокола допустимо только при автоматической фиксации (ч. 3 ст. 28.6 КоАП РФ). Ключ источника отличался.","f":1,"m":"pdf","s":0},{"id":"P0565","t":"subjects","q":"К категории абсолютных административных прав относится право на:","o":["хранение оружия","осуществление лицензируемой деятельности","управление мотоциклом","подачу административной жалобы"],"a":[3],"e":"Право на подачу жалобы — абсолютное.","f":0,"m":"pdf","s":0},{"id":"P0566","t":"offense","q":"Внутреннее строение административного права как отрасли права, представляющее собой упорядоченную совокупность норма административного права, регулирующих однородные общественные отношения в различных сферах государственного управления, называется:","o":["композиция","содержание","система","структура"],"a":[2],"e":"Внутреннее строение отрасли — система.","f":0,"m":"pdf","s":1},{"id":"P0567","t":"procedure","q":"Имуществу И. в результате административного правонарушения был причинен вред. Однако И. не был указан в протоколе об административном правонарушении в качестве потерпевшего. Материалы административного дела переданы на рассмотрение в суд.","o":["для приобретения статуса потерпевшего И. необходимо обжаловать протокол об административном правонарушении","И. не сможет приобрести статус потерпевшего по данному делу, т.к. сведения о нем не указаны в протоколе","для приобретения статуса потерпевшего И. необходимо вынесение постановления о признании его потерпевшим","И. является потерпевшим в силу самого факта причинения вреда, ему нужно предоставить соответствующие документы судье","для приобретения статуса потерпевшего И. необходимо обжаловать постановление по делу об административном правонарушении"],"a":[3],"e":"Потерпевший — лицо, которому причинён вред (ст. 25.2 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0569","t":"procedure","q":"Определение понятия «орган исполнительной власти»:","o":["приведено в ФКЗ №2 «О правительстве РФ»","приведено в Конституции РФ","отсутствует в действующих НПА","приведено в указе Президента РФ","приведено в постановлении Правительства РФ"],"a":[2],"e":"Определение органа исполнительной власти в НПА отсутствует.","f":0,"m":"pdf","s":0},{"id":"P0570","t":"procedure","q":"Постановление о прекращении производства по делу об административном правонарушении выносится в случае:","o":["неподведомственности дела лицу, к которому протокол об административном правонарушении и другие материалы дела поступили на рассмотрение","назначения административного наказания","неправильного составления протокола об административном правонарушении","истечения сроков давности привлечения к административной ответственности","наличия смягчающих обстоятельств"],"a":[3],"e":"Истечение срока давности — основание прекращения (ст. 24.5 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0571","t":"bodies","q":"Руководители федеральных служб, подведомственных министерствам, руководство деятельностью которых осуществляет Президент РФ, назначаются на должность:","o":["федеральным министром","Государственно-правовым управлением Президента РФ","Управлением Президента РФ по внутренней политике","Администрацией Президента РФ","Президентом РФ"],"a":[4],"e":"Руководителей служб, подчинённых Президенту, назначает Президент.","f":0,"m":"pdf","s":0},{"id":"P0572","t":"bodies","q":"Структура исполнительных органов государственной власти субъекта РФ определяется:","o":["законом субъекта РФ","постановлением Правительства РФ","указом Президента РФ","актом высшего должностного лица субъекта РФ","федеральным законом"],"a":[3],"e":"Структуру органов исполнительной власти субъекта определяет высшее должностное лицо.","f":0,"m":"pdf","s":0},{"id":"P0573","t":"sources","q":"Административно-правовой метод регулирования общественных отношений характеризуется (пометить 2):","o":["согласованием воли сторон правоотношения","возможностью решения спора в административном порядке","решением спора только в судебном порядке","возникновением правоотношений, как правило, при наличии согласованного волеизъявления всех участников правоотношений","возникновение правоотношений, как правило, по воле одного из участников правоотношения"],"a":[1,4],"e":"Метод АП — возможность административного разрешения споров и инициатива одной стороны.","f":0,"m":"pdf","s":1},{"id":"P0574","t":"procedure","q":"По общему правилу дело об административном правонарушении рассматривается по месту:","o":["нахождения большинства доказательств по делу об административном правонарушении","нахождения административного органа, составившего протокол об административном правонарушении","жительства потерпевшего-физического лица","жительства лица, в отношении которого ведется производство по делу об административном правонарушении","совершения административного правонарушения"],"a":[4],"e":"Дело рассматривается по месту совершения (ст. 29.5 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0575","t":"procedure","q":"Протокол осмотра места совершения административного правонарушения составляется:","o":["в течение 3 суток с момента возбуждения дела об административном правонарушении","в течение 30 суток после совершения административного правонарушения","в течение 2-х суток после выявления административного правонарушения","немедленно после выявления административного правонарушения","в течение 2-х суток с момента совершения административного правонарушения"],"a":[3],"e":"Протокол осмотра составляется немедленно (ст. 27.8 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0577","t":"bodies","q":"Основным признаком акта органа исполнительной в ечёт приостановление или аннулирование лицензии (ФЗ № 99-ФЗ).","f":0,"m":"pdf","s":0},{"id":"P0606","t":"penalty","q":"Что не входит в задачи законодательства об административных правонарушениях?","o":["защита личности","предупреждение административных правонарушений","возмещение материального ущерба","охрана здоровья","охрана санитарно-эпидемиологического благополучия населения"],"a":[2],"e":"Возмещение ущерба не входит в задачи законодательства (ст. 1.2 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0607","t":"procedure","q":"Какое понятие не включает в себя презумпция невиновности?","o":["лицо подлежит административной ответственности только за те административные правонарушения, в отношении которых установлена его вина","лицо, привлекаемое к административной ответственности, не обязано доказывать свою невиновность","при применении мер административного принуждения не допускается решение и действие (бездействие), унижающее человеческое достоинство","неустранимые сомнения в виновности лица, привлекаемого к административной ответственности, толкуются в пользу этого лица","лицо, в отношении которого ведется производство по делу об административном правонарушении, считается невиновным, пока его вина не будет доказана в порядке, предусмотренном настоящим кодексом, и установлена вступившим в законную силу постановлением судьи, органа, должностного лица, рассмотревших дело"],"a":[2],"e":"Запрет унижающих достоинство действий закреплён в ст. 1.6, а не в презумпции невиновности (ст. 1.5).","f":0,"m":"pdf","s":0},{"id":"P0609","t":"sources","q":"На чем основывается Кодекс Российской Федерации об административных правонарушениях?","o":["на Конституции РФ, общепринятых принципах и нормах международного права и международных договоров РФ","на Конституции РФ","на международных договорах, уголовном и уголовно-процессуальном законодательстве","на нормативных правовых актах РФ","на гражданском, трудовом, уголовном, уголовно-процессуальном и административном законодательствах"],"a":[0],"e":"КоАП основан на Конституции и международном праве (ст. 1.1 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0610","t":"procedure","q":"Чем устанавливаются особые условия применения мер обеспечения производства по делу об административном правонарушении, привлечения к административной ответственности должностных лиц, выполняющих определенные государственные функции (депутатов, судей, прокуроров и иных лиц)?","o":["только Кодексом об административных правонарушениях","только законодательством субъектов РФ","Конституцией РФ и федеральными законами","Кодексом об административных правонарушениях или законодательством субъектов РФ","Конституцией Российской Федерации"],"a":[2],"e":"Особые условия — Конституция и федеральные законы (ст. 1.4 КоАП РФ).","f":0,"m":"pdf","s":0},{"id":"P0611","t":"offense","q":"Независимо от чего юридические лица подлежат административной ответственности?","o":["от события административного правонарушения","от состава административного правонарушения","от издания акта амнистии, если таковой устраняет применение административного наказания","от местонахождения юридического лица","от отмены закона, установившего административную ответственность"],"a":[3],"e":"Юрлицо отвечает независимо от места нахождения и формы (ст. 2.10 КоАП РФ). Сверить.","f":1,"m":"pdf","s":0},{"id":"P0612","t":"procedure","q":"Найдите правильное толкование понятия «административное правонарушение»:","o":["административным правонарушением признается виновное действие (бездействие) юридического лица, за которое административным законодательством или законами субъектов Российской Федерации об административных правонарушениях установлена административная ответственность","административным правонарушением признается противоправное, виновное действие (бездействие) физического лица, за которое настоящим кодексом установлена административная ответственность","административным правонарушением (проступком) признается посягающее на государственный или общественный порядок, собственность  var locked=item.done&&inst;
 if(q.type==='mc'){
  if(isMulti(q))card.appendChild(el('div',{class:'multi',text:'Выберите несколько вариантов (правильных: '+q.ans.length+')'}));
  var box=el('div',{class:'opts'});
  item.order.forEach(function(oi,pos){
   var chosen=item.sel.indexOf(oi)>-1,correct=q.ans.indexOf(oi)>-1;
   var cls='opt'+(isMulti(q)?' m':'')+(chosen?' sel':'');
   var mk='';
   if(locked){cls='opt'+(isMulti(q)?' m':'');if(correct){cls+=' ok';mk='✓';}else if(chosen){cls+=' bad';mk='✕';}}
   else if(chosen)mk=isMulti(q)?'✓':'●';
   var b=el('button',{class:cls,type:'button',onclick:function(){pick(oi);}},[el('span',{class:'lt',text:locked&&correct?'✓':(locked&&chosen?'✕':'АБВГДЕЖЗИК'.charAt(pos))}),el('span',{class:'tx',text:q.opts[oi]})]);
   if(locked)b.disabled=true;
   box.appendChild(b);});
  card.appendChild(box);
 }else{
  var inp=el('input',{class:'txt',type:'text',placeholder:'Впишите ответ',autocomplete:'off','aria-label':'Ответ'});
  inp.value=item.text;if(locked)inp.disabled=true;
  inp.addEventListener('input',function(){item.text=inp.value;refreshBtns();});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();if(inst&&!item.done&&answered(item)){commit(item);render();}else if(!inst)go(1);}});
  card.appendChild(inp);
 }
 if(locked){
  var ex=el('div',{class:'expl '+(item.ok?'ok':'bad')});
  ex.appendChild(el('div',{class:'verdict',text:item.ok?'Верно':'Неверно'}));
  var right=q.type==='mc'?q.ans.map(function(i){return q.opts[i];}):[q.accept[0]];
  ex.appendChild(el('div',null,[el('span',{class:'lab',text:'Правильный ответ: '}),el('span',{text:right.join('; ')})]));
  if(q.e)ex.appendChild(el('div',{style:'margin-top:6px',text:q.e}));
  if(q.flag)ex.appendChild(el('div',{class:'warn',text:'⚠ Ответ спорный или не удалось достоверно проверить — сверьте с актуальной редакцией закона.'}));
  card.appendChild(ex);
 }
 var navb=el('div',{class:'row'});
 var last=run.i===N-1;
 if(inst){
  if(!item.done){
   var need=(q.type==='open')||isMulti(q);
   var ab=el('button',{class:'primary',type:'button',id:'btn-answer',text:'Ответить',onclick:function(){if(answered(item)){commit(item);render();}}});
   ab.disabled=!answered(item);
   if(need)navb.appendChild(ab);else navb.appendChild(el('span',{class:'hint',style:'align-self:center',text:'Нажмите на вариант — ответ засчитается сразу.'}));
  }else{
   navb.appendChild(el('button',{class:'primary',type:'button',text:last?'Завершить тест':'Следующий вопрос',onclick:function(){if(last){run.finished=true;}else run.i++;render();window.scrollTo(0,0);}}));
  }
  navb.appendChild(el('button',{class:'ghost',type:'button',text:'Выйти',onclick:function(){if(confirm('Прервать тест? Прогресс будет потерян.'))home();}}));
 }else{
  navb.appendChild(el('button',{type:'button',text:'←',title:'Назад','aria-label':'Назад',onclick:function(){go(-1);}}));
  navb.appendChild(el('button',{type:'button',text:item.mark?'★ Отмечен':'☆ Отметить',onclick:function(){item.mark=!item.mark;render();}}));
  navb.appendChild(el('button',{type:'button',text:'→',title:'Вперёд','aria-label':'Вперёд',onclick:function(){go(1);}}));
  navb.appendChild(el('button',{class:'primary',type:'button',text:'Завершить',onclick:finishEnd}));
 }
 $app.appendChild(card);
 var dock=el('div',{class:'dock'},[navb]);$app.appendChild(dock);
 if(inst)$app.appendChild(el('div',{class:'kbd'},[el('kbd',{text:'1–9'}),' выбрать · ',el('kbd',{text:'Enter'}),' ответить / дальше']));
 if(!inst){
  var g=el('div',{class:'grid'},run.qs.map(function(x,k){return el('button',{type:'button',class:(answered(x)?'done ':'')+(x.mark?'mark ':'')+(k===run.i?'cur':''),text:String(k+1),'aria-label':'Вопрос '+(k+1),onclick:function(){run.i=k;render();}});}));
  $app.appendChild(g);
 }
 if(q.type==='open'&&!locked){var f=document.querySelector('input.txt');if(f&&!('ontouchstart' in window))f.focus();}
}
function refreshBtns(){var b=document.getElementById('btn-answer');if(b)b.disabled=!answered(run.qs[run.i]);}
function pick(oi){
 var item=run.qs[run.i],q=item.q;if(item.done&&run.mode==='instant')return;
 if(isMulti(q)){var k=item.sel.indexOf(oi);if(k>-1)item.sel.splice(k,1);else item.sel.push(oi);render();}
 else{item.sel=[oi];if(run.mode==='instant'){commit(item);}render();}
}
function go(d){var n=run.i+d;if(n<0||n>=run.qs.length)return;run.i=n;render();window.scrollTo(0,0);}
function finishEnd(){
 var un=run.qs.filter(function(x){return !answered(x);}).length;
 if(un&&!confirm('Без ответа: '+un+'. Завершить тест?'))return;
 run.qs.forEach(function(x){x.done=true;x.ok=answered(x)?grade(x):false;if(answered(x))record(x);});
 run.finished=true;render();window.scrollTo(0,0);
}
/* ---------- итоги ---------- */
function results(){
 var N=run.qs.length,ok=run.qs.filter(function(x){return x.ok;}).length,bad=N-ok,pct=Math.round(100*ok/N);
 var wrong=run.qs.filter(function(x){return !x.ok;});
 $app.appendChild(el('h1',{text:'Результат'}));
 $app.appendChild(el('div',{class:'card'},[
  (function(){var r=el('div',{class:'ring'},[el('div',{text:pct+'%'})]);r.style.setProperty('--p',String(pct));r.style.setProperty('--c',pct>=75?'var(--ok)':(pct>=50?'var(--warn)':'var(--bad)'));return r;})(),
  el('div',{class:'msg',text:pct>=90?'Отлично!':(pct>=75?'Хороший результат':(pct>=50?'Неплохо, есть что подтянуть':'Нужно повторить материал'))}),
  el('div',{class:'stats'},[el('div',{class:'stat'},[el('span',{class:'lab',text:'Верно'}),el('b',{text:String(ok)})]),el('div',{class:'stat'},[el('span',{class:'lab',text:'Неверно'}),el('b',{text:String(bad)})]),el('div',{class:'stat'},[el('span',{class:'lab',text:'Всего'}),el('b',{text:String(N)})])]),
  el('div',{class:'row'},[
   el('button',{class:'primary',type:'button',text:'Пройти заново',onclick:function(){begin(run.qs.map(function(x){return x.q.id;}));}}),
   (wrong.length?el('button',{type:'button',text:'Повторить ошибки ('+wrong.length+')',onclick:function(){begin(shuffle(wrong.map(function(x){return x.q.id;})));}}):null),
   el('button',{class:'ghost',type:'button',text:'В меню',onclick:home})])]));
 function list(title,arr){
  if(!arr.length)return;
  $app.appendChild(el('h2',{text:title+' ('+arr.length+')'}));
  arr.forEach(function(x){
   var q=x.q;
   var det=el('details',{class:'res '+(x.ok?'ok':'bad')});
   det.appendChild(el('summary',null,[el('span',{class:'ic',text:x.ok?'✓':'✕'}),el('span',{text:q.q})]));
   var body=el('div',{class:'body'});
   if(q.type==='mc'){
    var mine=x.sel.map(function(i){return q.opts[i];});
    body.appendChild(el('p',null,[el('span',{class:'lab',text:'Ваш ответ: '}),el('span',{text:mine.length?mine.join('; '):'— нет ответа —'})]));
    body.appendChild(el('p',null,[el('span',{class:'lab',text:'Правильный ответ: '}),el('b',{text:q.ans.map(function(i){return q.opts[i];}).join('; ')})]));
   }else{
    body.appendChild(el('p',null,[el('span',{class:'lab',text:'Ваш ответ: '}),el('span',{text:x.text.trim()||'— нет ответа —'})]));
    body.appendChild(el('p',null,[el('span',{class:'lab',text:'Правильный ответ: '}),el('b',{text:q.accept[0]})]));
   }
   if(q.e)body.appendChild(el('p',{text:q.e}));
   if(q.flag)body.appendChild(el('div',{class:'warn',text:'⚠ Ответ спорный или не удалось достоверно проверить — сверьте с актуальной редакцией закона.'}));
   det.appendChild(body);$app.appendChild(det);});
 }
 list('Ошибки',wrong);
 list('Верные ответы',run.qs.filter(function(x){return x.ok;}));
}
document.addEventListener('keydown',function(e){
 if(!run||run.finished||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.target&&e.target.tagName==='INPUT')return;
 var item=run.qs[run.i],q=item.q,inst=run.mode==='instant';
 if(q.type==='mc'&&/^[1-9]$/.test(e.key)&&!(item.done&&inst)){var oi=item.order[+e.key-1];if(oi!==undefined){e.preventDefault();pick(oi);}}
 else if(e.key==='Enter'){e.preventDefault();
  if(inst){if(!item.done){if(answered(item)&&(q.type==='open'||isMulti(q))){commit(item);render();}}
   else{var b=document.querySelector('.dock .primary');if(b)b.click();}}
  else go(1);}
 else if(!inst&&e.key==='ArrowRight')go(1);
 else if(!inst&&e.key==='ArrowLeft')go(-1);
});
home();
})();
</script>
</body>
</html>
